<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>多伦兰王国 · 省份预览器</title>
<style>
  /* ============ 布局：左边栏 + 右侧地图 ============ */
  html, body { margin: 0; height: 100%; background: #1c2733;
               font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  #app { display: flex; width: 100vw; height: 100vh; }

  /* ============ 边栏 ============ */
  #sidebar { width: 270px; min-width: 270px; height: 100%; overflow-y: auto;
             background: #16212c; color: #cfd8e0; padding: 14px;
             box-sizing: border-box; border-right: 1px solid #0c141d;
             transition: margin-left .25s; }
  /* 边栏收起时整体左移出屏幕 */
  body.sb-hidden #sidebar { margin-left: -270px; }
  #sidebar h1 { font-size: 18px; margin: 0; color: #fff; }
  #sidebar .stats { font-size: 12px; color: #7f92a3; margin: 4px 0 10px; }
  #sidebar .sec { font-size: 12px; color: #6c8194; margin: 14px 0 6px;
                  border-bottom: 1px solid #24313f; padding-bottom: 3px; }

  /* 搜索框 */
  #search { width: 100%; box-sizing: border-box; padding: 6px 9px; font-size: 13px;
            background: #0f1922; border: 1px solid #2a3a4a; border-radius: 6px;
            color: #cfd8e0; outline: none; }
  #search:focus { border-color: #4a7ba6; }

  /* 省份列表项 */
  .pitem { display: flex; align-items: center; gap: 8px; padding: 5px 7px;
           border-radius: 6px; cursor: pointer; font-size: 13px; }
  .pitem:hover { background: #22313f; }
  .pitem .sw { width: 13px; height: 13px; border-radius: 3px; flex: none;
               border: 1px solid rgba(0,0,0,.4); }
  .pitem .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pitem small { color: #7f92a3; font-size: 11px; }
  .pitem .pp { font-size: 11px; color: #6c8194; }

  /* 图层开关行 */
  .lyr { display: flex; align-items: center; gap: 7px; font-size: 13px;
         padding: 3px 2px; cursor: pointer; user-select: none; }
  .lyr input { accent-color: #4a7ba6; }

  /* ============ 高德风格地图控件 ============ */
  /* 右下：竖排缩放按钮（白底圆角卡片） */
  #map-ctrl { position: absolute; right: 16px; bottom: 30px; z-index: 9;
              display: flex; flex-direction: column; gap: 1px;
              background: #fff; border: 1px solid #c9d4de; border-radius: 6px;
              overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  #map-ctrl button { width: 32px; height: 32px; border: 0; background: #fff;
                     color: #3c4650; font-size: 16px; cursor: pointer; line-height: 1; }
  #map-ctrl button:hover { background: #eef3f7; }
  #map-ctrl button + button { border-top: 1px solid #e1e8ee; }
  #zoomLevel { position: absolute; right: 18px; bottom: 8px; z-index: 9;
               font-size: 10px; color: rgba(255,255,255,.75);
               text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  /* 左下：比例尺 */
  #scale { position: absolute; left: 16px; bottom: 16px; z-index: 9;
           font-size: 11px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7);
           user-select: none; pointer-events: none; }
  #scale i { display: block; height: 5px; border: 1px solid #fff; border-top: 0;
             box-sizing: border-box; margin-top: 2px; }
  /* 右上：视图切换 */
  #view-switch { position: absolute; top: 12px; right: 16px; z-index: 9; }
  #view-switch a { display: inline-block; padding: 7px 12px; font-size: 13px;
                   background: #fff; color: #3c4650; border-radius: 4px;
                   text-decoration: none; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  #view-switch a:hover { background: #f0f5f9; }

  /* 页面跳转链接 */
  .viewlink { display: block; padding: 7px 9px; font-size: 13px;
              background: #22313f; color: #cfd8e0; border-radius: 6px;
              text-decoration: none; text-align: center; }
  .viewlink:hover { background: #2d4054; }

  /* 提示与图例（图例随边栏内容流式排列，不遮挡地图控件） */
  #tips { font-size: 11px; color: #5f7386; line-height: 1.8; }
  #legend { margin-top: 12px; background: #fdfdf8; border: 2px solid #8a1f1f;
            border-radius: 4px; padding: 6px 10px; font-size: 12px; color: #333; }
  #legend .sw { display: inline-block; width: 11px; height: 11px; background:
                #6386a4; margin-right: 6px; vertical-align: -1px; }

  /* 边栏收起/展开按钮（固定在左上角） */
  #sb-toggle { position: fixed; left: 278px; top: 10px; z-index: 20;
               width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
               background: #22313f; color: #cfd8e0; border: 1px solid #2a3a4a;
               transition: left .25s; }
  body.sb-hidden #sb-toggle { left: 8px; }

  /* ============ 地图区 ============ */
  #stage { position: relative; flex: 1; overflow: hidden; background: #466eab; }
  svg    { position: relative; z-index: 1;   /* 盖在海面动效之上 */
           width: 100%; height: 100%; display: block;
           background: transparent;          /* 海洋底色改由 #stage 提供 */
           cursor: grab; }
  svg.panning { cursor: grabbing; }

  /* ============ 海洋动效（低开销：纯 CSS transform，不触发重排） ============ */
  /* 两团明暗光斑在海上缓慢漂移，配合 prefers-reduced-motion 自动关闭 */
  #sea-fx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  #sea-fx i { position: absolute; width: 140%; height: 140%; border-radius: 50%;
              will-change: transform; opacity: .08; }
  #sea-fx i:nth-child(1) {  /* 亮斑：像阳光洒在海面 */
    background: radial-gradient(closest-side, #9fd0ff, transparent 70%);
    top: -45%; left: -25%; animation: sea-drift-1 47s ease-in-out infinite alternate; }
  #sea-fx i:nth-child(2) {  /* 暗斑：像深海洋流 */
    background: radial-gradient(closest-side, #0c2438, transparent 70%);
    bottom: -50%; right: -30%; animation: sea-drift-2 61s ease-in-out infinite alternate; }
  @keyframes sea-drift-1 { to { transform: translate(28vw, 10vh) scale(1.25); } }
  @keyframes sea-drift-2 { to { transform: translate(-24vw, -12vh) scale(1.18); } }
  /* 波纹层：两组细条纹反向流动，叠出洋面粼光（transform 动画，只在海域可见） */
  #sea-fx b { position: absolute; inset: -60%; will-change: transform; }
  #sea-fx b.w1 { background: repeating-linear-gradient(8deg,
    rgba(255,255,255,.028) 0 2px, transparent 2px 34px);
    animation: wave-y 26s linear infinite; }
  #sea-fx b.w2 { background: repeating-linear-gradient(97deg,
    rgba(255,255,255,.022) 0 2px, transparent 2px 47px);
    animation: wave-x 38s linear infinite; }
  /* 平移量 = 沿条纹法向恰好一个周期（34/sin8°·sin… ），保证循环无缝 */
  @keyframes wave-y { to { transform: translate(4.7px, -33.7px); } }
  @keyframes wave-x { to { transform: translate(46.6px, 5.7px); } }
  @media (prefers-reduced-motion: reduce) {
    #sea-fx i, #sea-fx b { animation: none; }   /* 用户系统开启"减少动态效果"时停用 */
  }

  /* 省份默认描边；hover 提亮；non-scaling 让边框粗细不随缩放变化 */
  .prov { stroke: #2b3440; stroke-width: .7; stroke-linejoin: round;
          cursor: pointer; transition: filter .15s; }
  .prov path { vector-effect: non-scaling-stroke; }
  .prov:hover  { filter: brightness(1.18); }
  .prov.active { stroke: #ffd54a; stroke-width: 2.2; }
  .prov.hl     { filter: brightness(1.25); }        /* 边栏悬停时的预览高亮 */

  /* 湖泊盖在省份上面 */
  .lake { fill: #dce9f2; stroke: #8fb3c9; stroke-width: .4;
          pointer-events: none; }
  .lake path, path.lake { vector-effect: non-scaling-stroke; }

  /* 省名标签（JS 会反向缩放，保证放大后文字不变大） */
  .plabel { font-size: 13px; fill: #10222e; paint-order: stroke;
            stroke: rgba(255,255,255,.55); stroke-width: 2.5px;
            text-anchor: middle; pointer-events: none; user-select: none; }

  /* 省会圆点 */
  .capital-dot { fill: #7a1f1f; stroke: #fff; stroke-width: .8; pointer-events: none; }
  .capital-name { font-size: 10px; fill: #5c1010; text-anchor: middle;
                  paint-order: stroke; stroke: rgba(255,255,255,.6); stroke-width: 2px;
                  pointer-events: none; user-select: none; }

  /* ============ 点击气泡（吸附在省份上） ============ */
  /* 用 visibility+opacity 而非 display 切换，保证 transition 稳定触发 */
  #bubble { position: absolute; visibility: hidden; width: 260px;
            background: rgba(250, 250, 245, .97); color: #22303c;
            border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.45);
            padding: 12px 14px; z-index: 10;
            /* 窗口动画：打开时淡入 + 上浮展开 */
            opacity: 0; transform: translateY(8px) scale(.92);
            transition: opacity .18s ease, transform .18s ease,
                        visibility 0s linear .18s; }
  #bubble.show { visibility: visible; opacity: 1; transform: none;
                 transition: opacity .18s ease, transform .18s ease; }
  /* --ax 记录锚点在气泡内的相对位置，箭头始终指向省份锚点 */
  #bubble::after { content: ""; position: absolute; left: var(--ax, 50%); bottom: -8px;
                   margin-left: -8px; border: 8px solid transparent;
                   border-top-color: rgba(250,250,245,.97); border-bottom: 0;
                   transition: left .18s ease; }
  /* 锚点上方放不下时气泡翻到下方，箭头朝上 */
  #bubble.below::after { bottom: auto; top: -8px;
                         border-top: 0; border-bottom: 8px solid rgba(250,250,245,.97); }
  #bubble h3 { margin: 0 0 2px; font-size: 16px; }
  #bubble .sub { font-size: 11px; color: #7c8a96; margin-bottom: 6px; }
  #bubble .row { font-size: 12.5px; margin: 3px 0; }
  #bubble .row b { color: #33566e; }
  #bubble .intro { font-size: 12px; line-height: 1.65; margin-top: 6px;
                   border-top: 1px dashed #c8d2da; padding-top: 6px; color: #47586a; }
  #bubble .close { position: absolute; top: 6px; right: 9px; cursor: pointer;
                   color: #9aa7b2; font-size: 14px; }
  #bubble .close:hover { color: #444; }
</style>

<div id="app">
  <!-- ==================== 左侧多功能边栏 ==================== -->
  <div id="sidebar">
    <h1><a href="../index.html" style="color:#fff;text-decoration:none">多伦兰王国</a></h1>
    <div class="stats" id="stat-line"></div>

    <div class="sec">省份（按人口排序）</div>
    <input id="search" type="text" placeholder="🔍 输入省名过滤…">
    <div id="plist"></div>

    <div class="sec">图层</div>
    <label class="lyr"><input type="checkbox" id="t-labels" checked> 省名标签</label>
    <label class="lyr"><input type="checkbox" id="t-capitals" checked> 省会标记</label>
    <label class="lyr"><input type="checkbox" id="t-lakes" checked> 湖泊</label>
    <label class="lyr"><input type="checkbox" id="t-borders" checked> 省界线</label>

    <div class="sec">操作提示</div>
    <div id="tips">🖱 滚轮：以鼠标为中心缩放<br>✋ 拖拽：平移地图（到边界会停住）<br>🖱 点击省份：查看详情<br>📋 点击左侧省份：定位并放大</div>

    <div id="legend"><span class="sw"></span>多伦兰王国</div>
  </div>
  <button id="sb-toggle" title="收起/展开边栏">⟨</button>

  <!-- ==================== 右侧地图 ==================== -->
  <div id="stage">
    <!-- 海洋动效层：垫在地图 svg 下面（波纹只会在海域露出来） -->
    <div id="sea-fx"><i></i><i></i><b class="w1"></b><b class="w2"></b></div>

    <svg id="map" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">

    </svg>

    <!-- 点击省份后出现的气泡 -->
    <div id="bubble">
      <span class="close" onclick="hideBubble()">✕</span>
      <h3 id="b-name"></h3>
      <div class="sub" id="b-full"></div>
      <div class="row">⚔ 所属：<b id="b-state"></b></div>
      <div class="row">🏛 省会：<b id="b-capital"></b></div>
      <div class="row">👥 人口：<b id="b-pop"></b></div>
      <div class="row">📐 面积：<b id="b-area"></b> km²</div>
      <div class="row">🏘 主要城镇：<span id="b-towns"></span></div>
      <div class="intro" id="b-intro"></div>
    </div>

    <!-- 高德风格控件：右上视图切换 / 右下缩放 / 左下比例尺 -->
    <div id="view-switch"><a href="satellite.html">🛰 卫星视图</a></div>
    <div id="map-ctrl">
      <button id="z-reset" title="复位">⟲</button>
      <button id="z-in" title="放大">＋</button>
      <button id="z-out" title="缩小">－</button>
    </div>
    <div id="scale"><span id="scale-km"></span><i id="scale-line"></i></div>
    <div id="zoomLevel">100%</div>
  </div>
</div>

// 省份简介：在这里自由编写/修改，key 用省名。
// 没写到的省使用脚本按数据自动生成的 intro 初稿。

};

const STATE_NAME = "多伦兰王国";
const W = 1920, H = 1080;      // 地图原始尺寸（svg viewBox）

/* ==================== 基础渲染 ==================== */
const svg   = document.getElementById('map');
const world = document.getElementById('world');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || world).appendChild(e);
  return e;
}

// 1) 省份多边形（含离岛），fill 用 Azgaar 导出的省色
const provEls = {};               // id -> <g>
for (const p of PROVINCES) {
  const g = el('g', { class: 'prov', 'data-id': p.id });
  g.setAttribute('fill', p.color);
  el('path', { d: p.mainPath }, g);
  for (const d of p.islandPaths) el('path', { d }, g);
  g.addEventListener('click', ev => {
    if (movedFar) return;         // 拖拽结束后的误触不当作点击
    showBubble(p);                // 气泡锚定在省份中心，不跟随点击点
  });
  provEls[p.id] = g;
}

// 2) 湖泊
const lakeEls = [];
for (const d of LAKES) lakeEls.push(el('path', { d, class: 'lake' }));

// 3) 省名标签：记录原始坐标 data-x/y，缩放时反向缩放保持字号恒定
const labelEls = [];
for (const p of PROVINCES) {
  const t = el('text', { class: 'plabel', x: 0, y: 0,
                         'data-x': p.label[0], 'data-y': p.label[1] });
  t.textContent = p.name;
  labelEls.push(t);
}

// 4) 省会标记（红点 + 名字），同样反向缩放
const capEls = [];
for (const p of PROVINCES) {
  if (!p.capitalXY) continue;
  const c = el('circle', { class: 'capital-dot', r: 2.6,
                           'data-x': p.capitalXY[0], 'data-y': p.capitalXY[1] });
  const t = el('text', { class: 'capital-name', x: 0, y: 0,
                         'data-x': p.capitalXY[0], 'data-y': p.capitalXY[1] - 5 });
  t.textContent = p.capital;
  capEls.push(c, t);
}

/* ==================== 缩放与平移 ==================== */
// view：当前视图状态。s=缩放倍数，(x,y)=平移量（viewBox 坐标系）
const view = { x: 0, y: 0, s: 1 };
const MIN_S = 1, MAX_S = 8;
let movedFar = false;             // 本次鼠标按下后是否发生了拖拽

function applyView() {
  // 边界限制：地图边缘不允许拖出视口（放大 1 倍时完全不能平移）
  clampView();
  world.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.s})`);
  // 标签与省会标记反向缩放，字号/圆点大小恒定
  const inv = 1 / view.s;
  for (const e of [...labelEls, ...capEls]) {
    const x = +e.dataset.x, y = +e.dataset.y;
    e.setAttribute('transform', `translate(${x},${y}) scale(${inv})`);
  }
  document.getElementById('zoomLevel').textContent = Math.round(view.s * 100) + '%';
  updateScale();
}

// 平移范围钳制：屏幕上能看到的内容始终不越出地图 [0,W]x[0,H]
// （推导：屏幕位置 = vx*s + tx，要求窗口左缘 >=0、右缘 <=W）
function clampView() {
  view.x = Math.min(0, Math.max(-W * (view.s - 1), view.x));
  view.y = Math.min(0, Math.max(-H * (view.s - 1), view.y));
}

/* ==================== 比例尺（高德风格） ==================== */
const KM_PER_UNIT = 3.0;   // 每地图单位 ≈ 多少 km（取自导出设置 distanceScale）
function niceKm(km) {           // 把刻度取整到 1/2/5×10^n
  const p = Math.pow(10, Math.floor(Math.log10(km)));
  const m = km / p;
  return (m >= 5 ? 5 : m >= 2 ? 2 : 1) * p;
}
function updateScale() {
  const ctm = svg.getScreenCTM();
  if (!ctm) return;
  const vbPerCss = 1 / ctm.a;               // 每 CSS 像素对应多少地图单位
  const target = niceKm(90 * vbPerCss * KM_PER_UNIT);
  document.getElementById('scale-km').textContent = target + ' km';
  document.getElementById('scale-line').style.width =
    (target / (vbPerCss * KM_PER_UNIT)) + 'px';
}

// 屏幕坐标 -> viewBox 坐标
function clientToSvg(cx, cy) {
  const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

// 以 viewBox 上的一点为中心缩放（保持该点屏幕位置不动）
function zoomAt(cx, cy, factor) {
  const s1 = view.s;
  const s2 = Math.min(MAX_S, Math.max(MIN_S, s1 * factor));
  // 保持锚点屏幕位置不动：vx*s1 + x1 = vx*s2 + x2
  view.x += cx * (s1 - s2);
  view.y += cy * (s1 - s2);
  view.s = s2;
  if (s2 === MIN_S) { view.x = 0; view.y = 0; }   // 缩回原始大小即复位平移
  applyView();
}

svg.addEventListener('wheel', ev => {
  ev.preventDefault(); stopAnim();
  const p = clientToSvg(ev.clientX, ev.clientY);
  zoomAt(p.x, p.y, ev.deltaY < 0 ? 1.2 : 1 / 1.2);
}, { passive: false });

// 拖拽平移：记录起点，mousemove 时按屏幕位移换算 viewBox 位移
let drag = null;
svg.addEventListener('mousedown', ev => {
  stopAnim();
  drag = { sx: ev.clientX, sy: ev.clientY, vx: view.x, vy: view.y };
  movedFar = false;
  svg.classList.add('panning');
});
window.addEventListener('mousemove', ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
  if (Math.abs(dx) + Math.abs(dy) > 3) movedFar = true;
  const sc = svg.getScreenCTM().a;               // 屏幕像素 -> viewBox 单位
  view.x = drag.vx + dx / sc;
  view.y = drag.vy + dy / sc;
  applyView();
});
window.addEventListener('mouseup', () => { drag = null; svg.classList.remove('panning'); });

// 边栏缩放按钮：以地图中心为基准
function zoomCenter(factor) { zoomAt(W / 2, H / 2, factor); }
document.getElementById('z-in').onclick    = () => zoomCenter(1.35);
document.getElementById('z-out').onclick   = () => zoomCenter(1 / 1.35);
document.getElementById('z-reset').onclick = () => animateTo({ x: 0, y: 0, s: 1 }, 450);

// "飞到"某省：缩放倍率按包围盒算，中心用省名标签位置（主陆质心），
// 避免群岛型省份（如海连府）因包围盒偏海而看不清主体
function flyTo(p) {
  const [x0, y0, x1, y1] = p.bbox;
  const bw = x1 - x0, bh = y1 - y0;
  const s = Math.min(MAX_S, Math.max(MIN_S, Math.min(W / bw, H / bh) * 0.72));
  animateTo({ x: W / 2 - s * p.label[0], y: H / 2 - s * p.label[1], s }, 550);
}

// 视图动画：缓动插值过去（缩放按对数插值，观感更自然）
let animId = null;
function animateTo(target, ms = 500) {
  if (animId) cancelAnimationFrame(animId);
  const from = { ...view };
  const t0 = performance.now();
  const ease = u => 1 - Math.pow(1 - u, 3);       // easeOutCubic
  function step(now) {
    const u = Math.min(1, (now - t0) / ms);
    const k = ease(u);
    view.x = from.x + (target.x - from.x) * k;
    view.y = from.y + (target.y - from.y) * k;
    view.s = from.s * Math.pow(target.s / from.s, k);
    applyView();
    animId = u < 1 ? requestAnimationFrame(step) : null;
  }
  animId = requestAnimationFrame(step);
}
// 用户手动操作时打断进行中的动画
function stopAnim() { if (animId) { cancelAnimationFrame(animId); animId = null; } }

/* ==================== 边栏 ==================== */
// 顶部统计行
const totalPop = PROVINCES.reduce((a, p) => a + p.popRaw, 0);
document.getElementById('stat-line').textContent =
  `${PROVINCES.length} 省 · 总人口 ${fmtPopCN(totalPop)}`;
function fmtPopCN(n) {
  if (n >= 1e8) return (n / 1e8).toFixed(2) + ' 亿';
  if (n >= 1e4) return (n / 1e4).toFixed(1) + ' 万';
  return String(n);
}

// 省份列表（数据本身已按人口降序）
const plist = document.getElementById('plist');
const listItems = {};
for (const p of PROVINCES) {
  const it = document.createElement('div');
  it.className = 'pitem';
  it.innerHTML =
    `<span class="sw" style="background:${p.color}"></span>` +

}

// 搜索过滤：按省名/省会实时筛选
document.getElementById('search').addEventListener('input', ev => {

bindToggle('t-labels', labelEls);

document.getElementById('t-borders').addEventListener('change', ev =>

/* ==================== 气泡逻辑（吸附在省份上） ==================== */
const bubble = document.getElementById('bubble');
const stage = document.getElementById('stage');
let activeId = null;
let anchor = null;      // { p, ax, ay }：气泡锚定的省份与 viewBox 坐标（省名标签处）
let hideTimer = null;

// 打开气泡：不传屏幕坐标，直接锚定在省份的标签位置，
// 之后缩放/平移时 updateBubblePos 会跟随，气泡始终"吸"在领土上
function showBubble(p) {
  clearTimeout(hideTimer);
  if (activeId !== null) provEls[activeId].classList.remove('active');
  activeId = p.id;
  provEls[p.id].classList.add('active');
  anchor = { p, ax: p.label[0], ay: p.label[1] };

  document.getElementById('b-name').textContent   = p.name;
  document.getElementById('b-full').textContent   = p.fullName;
  document.getElementById('b-state').textContent  = STATE_NAME;
  document.getElementById('b-capital').textContent = p.capital;
  document.getElementById('b-pop').textContent    = p.pop + ' 人';
  document.getElementById('b-area').textContent   = p.area.toLocaleString();
  document.getElementById('b-towns').textContent  = p.towns.join('、') || '—';
  document.getElementById('b-intro').textContent  = INTROS[p.name] || p.intro || INTROS['_默认'];

  bubble.classList.add('show');                 // 同步加类，CSS 过渡自动播放
  updateBubblePos();
}

// 把气泡摆到锚点的屏幕位置：默认在锚点上方、箭头指向锚点；
// 上方放不下翻到下方（.below），左右出界时收进来
function updateBubblePos() {
  if (!anchor) return;
  const m = world.getScreenCTM();            // viewBox 坐标 -> 屏幕坐标（含缩放平移）
  const sx = anchor.ax * m.a + m.e;
  const sy = anchor.ay * m.d + m.f;
  const r = stage.getBoundingClientRect();
  const px = sx - r.left, py = sy - r.top;   // 转成 stage 内坐标
  const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
  const sw = stage.clientWidth, sh = stage.clientHeight;
  bubble.classList.remove('below');
  let x = px - bw / 2, y = py - bh - 12;
  if (y < 8) { y = py + 14; bubble.classList.add('below'); }
  x = Math.max(8, Math.min(x, sw - bw - 8));
  if (y + bh > sh - 8) y = Math.max(8, sh - bh - 8);
  bubble.style.left = x + 'px';
  bubble.style.top = y + 'px';
  // 箭头水平位置对准锚点（限制在气泡宽度内）
  const ax = Math.max(16, Math.min(px - x, bw - 16));
  bubble.style.setProperty('--ax', ax + 'px');
}
// 让 applyView 在缩放/平移/动画的每一帧都刷新气泡位置
const _applyView = applyView;
applyView = function () { _applyView(); updateBubblePos(); };

function hideBubble() {
  bubble.classList.remove('show');           // 播淡出动画，visibility 延迟生效
  if (activeId !== null) provEls[activeId].classList.remove('active');
  activeId = null; anchor = null;
}
// 点空白处（海域）关闭气泡
svg.addEventListener('click', ev => { if (ev.target === svg && !movedFar) hideBubble(); });

// 初始视图
applyView();
</script>
</body>
</html>
