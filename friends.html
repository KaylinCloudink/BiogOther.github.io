<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaylin博客 · 友邻小站</title>
<link rel="icon" href="../logo.ico" type="image/x-icon">
<style>
  /* ================================================================
     便当盒(Bento)风格 —— 友情链接页
     ----------------------------------------------------------------
     · 友链数据在页面底部 <script> 的 linksData 数组里，直接改那里
     · 卡片由 JS 渲染进 .bento 网格（容器用 display:contents 穿透）
     ================================================================ */

  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg:#0f1115; --card:#171a21; --card2:#1c2029;
    --ink:#e9ecf2; --muted:#8b93a3;
    --line:#232837; --line-hi:#39415a;
  }

  body {
    background:var(--bg); color:var(--ink);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.65;
  }

  .wrap { max-width:1020px; margin:0 auto; padding:30px 24px 40px; }

  header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:28px; }
  .logo { font-size:19px; font-weight:800; text-decoration:none; color:var(--ink); }
  .logo i { font-style:normal; background:linear-gradient(135deg,#3b82f6,#8b5cf6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  nav a { color:var(--muted); text-decoration:none; margin-left:22px; font-size:14px; }
  nav a:hover { color:var(--ink); }
  nav a.on { color:#a5b8ff; }

  .bento { display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:134px; gap:14px; }
  .cell {
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:20px; overflow:hidden; position:relative;
    min-width:0; overflow-wrap:anywhere;
    height:100%;
    transition:transform .18s, border-color .18s;
    display:flex; flex-direction:column;
  }
  .cell:hover { transform:translateY(-3px); border-color:var(--line-hi); box-shadow:0 12px 28px rgba(0,0,0,.35); }
  .c2 { grid-column:span 2; } .r2 { grid-row:span 2; }
  .lab { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .grad-fire { background:linear-gradient(135deg,#f59e0b,#ef4444); border:none; }
  .grad-fire .lab { color:rgba(255,255,255,.75); }
  .hero-cell { justify-content:flex-end; }
  .hero-cell h1 { font-size:clamp(22px,3vw,30px); font-weight:800; line-height:1.25; color:#fff; }
  .hero-cell p  { color:rgba(255,255,255,.85); font-size:14px; margin-top:8px; }
  .big-num { font-size:34px; font-weight:800; margin-top:auto; line-height:1.15; }
  .big-num small { font-size:13px; color:var(--muted); font-weight:normal; margin-left:8px; }
  .emoji { font-size:20px; margin-bottom:2px; line-height:1; }

  /* JS 渲染容器：display:contents 让子元素直接成为网格项 */
  #links-container { display:contents; }

  /* ---------- 友链卡片（JS 渲染，占 2 列 2 行） ---------- */
  a.fcard { text-decoration:none; color:inherit; }   /* c2/r2 写在 <a> 上才对网格生效 */
  a.fcard .cell { flex-direction:row; align-items:center; gap:18px; }
  a.fcard .favatar {
    flex-shrink:0; width:72px; height:72px; border-radius:50%;
    object-fit:cover;                              /* 头像裁切填满圆形 */
    border:3px solid var(--line-hi);
    display:flex; align-items:center; justify-content:center;
    font-size:26px; background:var(--card2);
  }
  a.fcard .finfo { flex:1; min-width:0; display:flex; flex-direction:column; height:100%; }
  a.fcard .ft { font-size:17px; font-weight:700; }
  a.fcard:hover .ft { color:#a5b8ff; }
  a.fcard .fx { color:var(--muted); font-size:13px; line-height:1.65; margin-top:6px; flex:1; }
  a.fcard .go { margin-top:auto; font-size:13px; font-weight:600; color:#fbbf77; }

  /* 空状态格 */
  .empty-cell { justify-content:center; align-items:center; text-align:center; color:var(--muted); }

  .foot { text-align:center; color:var(--muted); font-size:12px; margin-top:40px; }

  @media (max-width:820px) {
    .bento { grid-template-columns:repeat(2,1fr); }
    .c2 { grid-column:span 2; }
    nav a { margin-left:14px; }
  }
  @media (max-width:480px) {
    .bento { grid-auto-rows:minmax(140px, auto); }
  }

  /* ================================================================
     动画效果：rise 载入浮现 / drift 渐变流动 / 悬浮投影
     ================================================================ */
  @keyframes rise {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:none; }
  }
  @keyframes drift {
    from { background-position:0% 0%; }
    to   { background-position:100% 100%; }
  }
  .bento > * { animation:rise .55s cubic-bezier(.22,.61,.36,1) both; }
  .bento > *:nth-child(2)  { animation-delay:.07s; }
  .bento > *:nth-child(3)  { animation-delay:.14s; }
  .bento > *:nth-child(4)  { animation-delay:.21s; }
  .bento > *:nth-child(5)  { animation-delay:.28s; }
  .bento > *:nth-child(6)  { animation-delay:.35s; }
  .grad-fire { background-size:180% 180%; }
  .bento > .grad-fire {
    animation:rise .55s cubic-bezier(.22,.61,.36,1) both, drift 10s ease-in-out infinite alternate;
  }
  @media (prefers-reduced-motion: reduce) {
    .bento > *, .bento > .grad-fire { animation:none; }
    .cell, .cell:hover { transition:none; transform:none; box-shadow:none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ========== 顶部导航 ========== -->
  <header>
    <a href="index.html" class="logo">Kaylin<i>Other</i></a>
    <nav>
      <a href="https://kaylincloudink.github.io/KaylinBlog.github.io/">首页</a>
      <a href="https://kaylincloudink.github.io/KaylinBlog.github.io/articles.html">文章列表</a>
      <a href="https://kaylincloudink.github.io/KaylinBlog.github.io/tools.html">工具</a>
      <a href="index.html" class="on">其他页面</a>
      <a href="https://kaylincloudink.github.io/KaylinBlog.github.io/about.html">关于我</a>
    </nav>
  </header>

  <!-- ================================================================
       便当盒主体：标题大格 + JS 渲染的友链卡片
       #links-container 用 display:contents 穿透，卡片直接成为网格项
       ================================================================ -->
  <div class="bento">

    <!-- 标题大格 -->
    <div class="cell c2 r2 grad-fire hero-cell">
      <div>
        <div class="lab" style="margin-bottom:10px;">FRIENDS · 友情链接</div>
        <h1>🔗 友情链接</h1>
        <p>推荐一些有趣的小站和伙伴，点击按钮即可前往</p>
      </div>
    </div>

    <!-- 友链卡片由 JS 渲染到此处 -->
    <div id="links-container"></div>

    <!-- 统计格：友链总数（JS 会同步更新数字） -->
    <div class="cell">
      <div class="emoji">🤝</div>
      <div class="lab">友链数量</div>
      <div class="big-num" id="friend-count">-<small>位</small></div>
    </div>
  </div>

  <!-- ========== 页脚（文字与原站一致） ========== -->
  <footer class="foot">&copy; 2026 Kaylin Cloudink. 保留所有权利. 友邻链接 | 欢迎交换</footer>
</div>

<script>
  // ============================================================
  // 友情链接数据配置区域 ———— 请在此处修改/添加您的链接信息
  // 字段说明：title 名称 / description 描述 / avatar 头像路径 / url 链接
  // 注意：本页面在 bento/ 子目录，头像路径需带 ../ 前缀指向上级 images/
  // ============================================================
  const linksData = [
    {
      id: 1,
      title: "溟濩Bilibili主页",
      description: "认识好久好久的朋友了，画画很棒！！",
      avatar: "../images/MH文件已加识别码.jpg",
      url: "https://space.bilibili.com/1215919843?spm_id_from=333.1387.follow.user_card.click"
    },
    {
      id: 2,
      title: "雨猫的Bilibili主页",
      description: "可爱の猫猫，二战时期就认识了（划掉）画画很棒且画风独特！",
      avatar: "../images/cat已加识别码.jpg",
      url: "https://space.bilibili.com/458074995?spm_id_from=333.1387.follow.user_card.click"
    },
    {
      id: 3,
      title: "3",
      description: "描述",
      avatar: "../images/link_avatar3.png",
      url: "https://example.com/tools"
    }
    // 添加更多链接：复制上方对象，以逗号分隔，修改相应字段即可
  ];

  // 获取容器元素
  const container = document.getElementById('links-container');

  // 辅助函数：防止XSS
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      if (m === '"') return '&quot;';
      return m;
    });
  }

  // 渲染友情链接列表（每个友链 = 一张 2列×2行 的便当卡）
  function renderLinks() {
    if (!linksData.length) {
      container.innerHTML = '<div class="cell c2 r2 empty-cell">📭 暂无友情链接，请在 linksData 中添加数据</div>';
      return;
    }

    let html = '';
    linksData.forEach(link => {
      const safeTitle = escapeHtml(link.title);
      const safeDesc = escapeHtml(link.description || '');
      const safeUrl = escapeHtml(link.url);
      // 头像处理：路径为空显示 🔗，加载失败同样回退为 🔗
      let avatarHtml;
      if (link.avatar) {
        avatarHtml = `<img class="favatar" src="${link.avatar}" alt="${safeTitle}"
                        onerror="this.onerror=null; this.outerHTML='<span class=\\'favatar\\'>🔗</span>';">`;
      } else {
        avatarHtml = '<span class="favatar">🔗</span>';
      }

      html += `
        <a class="fcard c2 r2" href="${safeUrl}" target="_blank" rel="noopener noreferrer">
          <div class="cell">
            ${avatarHtml}
            <div class="finfo">
              <div class="ft">${safeTitle}</div>
              <div class="fx">${safeDesc}</div>
              <div class="go">点击前往 →</div>
            </div>
          </div>
        </a>`;
    });
    container.innerHTML = html;

    // 同步更新统计格数字
    const count = document.getElementById('friend-count');
    if (count) count.innerHTML = linksData.length + '<small>位</small>';
  }

  // 页面加载时初始化
  document.addEventListener('DOMContentLoaded', () => renderLinks());
</script>
</body>
</html>
