<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>其他 - 我的个人博客</title>
<link rel="icon" href="../logo.ico" type="image/x-icon">
<style>
  /* ================================================================
     便当盒(Bento)风格 —— BiogOther 导航首页
     ----------------------------------------------------------------
     快速修改指南：
     · 改配色      → :root 变量
     · 加一个格子  → 复制一段 .cell 结构放进 .bento
     · 跨格类      → c2(2列) / r2(2行)，必须写在网格直接子元素上
     · 动画        → 底部“动画效果”区块统一调整
     ================================================================ */

  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg:#0f1115; --card:#171a21; --card2:#1c2029;
    --ink:#e9ecf2; --muted:#8b93a3;
    --line:#232837; --line-hi:#39415a;
  }

  body {
    background:var(--bg); color:var(--ink);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.65;
  }

  .wrap { max-width:1020px; margin:0 auto; padding:30px 24px 40px; }

  /* ---------- 顶部导航 ---------- */
  header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:28px; }
  .logo { font-size:19px; font-weight:800; text-decoration:none; color:var(--ink); }
  .logo i { font-style:normal; background:linear-gradient(135deg,#3b82f6,#8b5cf6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  nav a { color:var(--muted); text-decoration:none; margin-left:22px; font-size:14px; }
  nav a:hover { color:var(--ink); }
  nav a.on { color:#a5b8ff; }

  /* ---------- 便当盒网格 ---------- */
  .bento { display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:134px; gap:14px; }
  .cell {
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:20px; overflow:hidden; position:relative;
    min-width:0; overflow-wrap:anywhere;   /* 长文字换行，不撑破网格 */
    height:100%;                           /* 填满所在网格行，防止溢出重叠 */
    transition:transform .18s, border-color .18s;
    display:flex; flex-direction:column;
  }
  .cell:hover { transform:translateY(-3px); border-color:var(--line-hi); box-shadow:0 12px 28px rgba(0,0,0,.35); }
  .c2 { grid-column:span 2; } .r2 { grid-row:span 2; }
  .lab { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .grad-blue { background:linear-gradient(135deg,#2563eb,#7c3aed); border:none; }
  .grad-blue .lab { color:rgba(255,255,255,.75); }
  .hero-cell { justify-content:flex-end; }
  .hero-cell h1 { font-size:clamp(22px,3vw,30px); font-weight:800; line-height:1.25; color:#fff; }
  .hero-cell p  { color:rgba(255,255,255,.85); font-size:14px; margin-top:8px; }
  .big-num { font-size:34px; font-weight:800; margin-top:auto; line-height:1.15; }
  .big-num small { font-size:13px; color:var(--muted); font-weight:normal; margin-left:8px; }
  .emoji { font-size:20px; margin-bottom:2px; line-height:1; }

  /* ---------- 链接卡片（可点击，占 2 列 2 行） ---------- */
  a.linkcard { text-decoration:none; color:inherit; }  /* c2/r2 写在 <a> 上才对网格生效 */
  a.linkcard .lemoji { font-size:30px; margin-bottom:8px; }
  a.linkcard .lt { font-size:18px; font-weight:700; margin:4px 0 6px; }
  a.linkcard:hover .lt { color:#a5b8ff; }
  a.linkcard .lx { color:var(--muted); font-size:13px; line-height:1.7; flex:1; }
  a.linkcard .go { margin-top:auto; font-size:13px; font-weight:600; color:#a5b8ff; }

  /* 标签药丸 */
  .chip {
    display:inline-block; align-self:flex-start;
    padding:3px 12px; border-radius:12px;
    font-size:11px; font-weight:600; letter-spacing:.08em;
    background:var(--card2); color:#a5b8ff; border:1px solid var(--line);
  }

  .foot { text-align:center; color:var(--muted); font-size:12px; margin-top:40px; }

  /* ---------- 移动端：4 列变 2 列 ---------- */
  @media (max-width:820px) {
    .bento { grid-template-columns:repeat(2,1fr); }
    .c2 { grid-column:span 2; }
    nav a { margin-left:14px; }
  }
  /* 极窄屏幕（≤480px）：行高允许随内容伸展，避免文字被裁切 */
  @media (max-width:480px) {
    .bento { grid-auto-rows:minmax(140px, auto); }
  }

  /* ================================================================
     动画效果（想调整动画强度改这一段即可）
     · rise  : 载入时格子从下方 16px 处依次浮现
     · drift : 渐变格背景 10 秒缓慢流动
     · 尊重系统“减弱动态效果”设置：开启后动画自动关闭
     ================================================================ */
  @keyframes rise {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:none; }
  }
  @keyframes drift {
    from { background-position:0% 0%; }
    to   { background-position:100% 100%; }
  }
  .bento > * { animation:rise .55s cubic-bezier(.22,.61,.36,1) both; }
  .bento > *:nth-child(2)  { animation-delay:.07s; }
  .bento > *:nth-child(3)  { animation-delay:.14s; }
  .bento > *:nth-child(4)  { animation-delay:.21s; }
  .bento > *:nth-child(5)  { animation-delay:.28s; }
  .bento > *:nth-child(6)  { animation-delay:.35s; }
  .grad-blue { background-size:180% 180%; }
  .bento > .grad-blue {
    animation:rise .55s cubic-bezier(.22,.61,.36,1) both, drift 10s ease-in-out infinite alternate;
  }
  @media (prefers-reduced-motion: reduce) {
    .bento > *, .bento > .grad-blue { animation:none; }
    .cell, .cell:hover { transition:none; transform:none; box-shadow:none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ========== 顶部导航：与原站相同的五个入口 ========== -->
  <header>
    <a href="index.html" class="logo">Kaylin<i>Other</i></a>
    <nav>
      <a href="https://kaylincloudink.github.io/KaylinBlog.github.io/">首页</a>
      <a href="https://kaylincloudink.github.io/KaylinBlog.github.io/articles.html">文章列表</a>
      <a href="https://kaylincloudink.github.io/KaylinBlog.github.io/tools.html">工具</a>
      <a href="index.html" class="on">其他页面</a>
      <a href="https://kaylincloudink.github.io/KaylinBlog.github.io/about.html">关于我</a>

  <!-- ================================================================

       ================================================================ -->
  <div class="bento">

    <!-- 标题大格 -->
    <div class="cell c2 r2 grad-blue hero-cell">
      <div>
        <div class="lab" style="margin-bottom:10px;">OTHER PAGES · 其他页面</div>
        <h1>📌 KaylinBlog Other Pages</h1>
        <p>这里是其他页面导航页，里面可能有令你感到有趣的东西（？）</p>
      </div>
    </div>

    <!-- 入口卡 1：OC设定集（原链接 OC/OCSET.html，bento 版为 oc.html） -->
    <a class="linkcard c2 r2" href="OC.html">
      <div class="cell">
        <div class="lemoji">✨</div>
        <div class="lt">OC设定集</div>
        <p class="lx">存放着各种设定</p>
        <span class="chip" style="margin-top:8px;">OC设定</span>
        <div class="go">进入 →</div>
      </div>
    </a>

    <!-- 入口卡 2：好友区 -->
    <a class="linkcard c2 r2" href="friends.html">
      <div class="cell">
        <div class="lemoji">❤️</div>
        <div class="lt">Kaylin好友区OwO</div>
        <p class="lx">都是好朋友的友情链接啦！</p>
        <span class="chip" style="margin-top:8px;">友情链接</span>
        <div class="go">进入 →</div>
      </div>
    </a>

    <!-- 入口卡 3：项目列表 -->
    <a class="linkcard c2 r2" href="projects.html">
      <div class="cell">
        <div class="lemoji">⏳</div>
        <div class="lt">项目列表</div>
        <p class="lx">正在进行中......</p>
        <span class="chip" style="margin-top:8px;">Projects进程</span>
        <div class="go">进入 →</div>
      </div>
    </a>

    <!-- 统计格：页面数 -->
    <div class="cell">
      <div class="emoji">🧭</div>
      <div class="lab">子页面</div>
      <div class="big-num">3<small>个</small></div>

    <!-- 统计格：友链数 -->
    <div class="cell">

      <div class="lab">友链</div>
      <div class="big-num">3<small>位</small></div>
    </div>
  </div>

  <!-- ========== 页脚（文字与原站一致） ========== -->
  <footer class="foot">&copy; 2026 Kaylin Cloudink. 保留所有权利. 网站使用AI编写</footer>
</div>
</body>
</html>
